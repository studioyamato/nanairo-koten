<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小林広志 個展 七色の軌跡（終了しました）</title>
<meta name="description" content="小林広志 個展『七色の軌跡』は2026年10月7日に終了しました。会場の様子は記録サイトでご覧いただけます。">
<link rel="canonical" href="https://studioyamato.com/nanairo/">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --c1:#e83030;--c2:#e87820;--c3:#d4be10;
  --c4:#30b030;--c5:#2070d0;--c6:#6030c0;--c7:#d030a0;
  --ink:#1a1278;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#fff 0%,#f0f4ff 100%);
  color:#222;
  font-family:'Noto Sans JP',sans-serif;
  font-weight:300;
  line-height:1.8;
}

.stripe-top{
  height:6px;
  background:linear-gradient(90deg,
    var(--c1) 0%,var(--c1) 14.3%,
    var(--c2) 14.3%,var(--c2) 28.6%,
    var(--c3) 28.6%,var(--c3) 42.9%,
    var(--c4) 42.9%,var(--c4) 57.1%,
    var(--c5) 57.1%,var(--c5) 71.4%,
    var(--c6) 71.4%,var(--c6) 85.7%,
    var(--c7) 85.7%,var(--c7) 100%);
}

main{
  flex:1;
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:3.5rem 1.5rem 3rem;
  text-align:center;
}

.kicker{
  font-weight:400;
  font-size:.8rem;
  letter-spacing:.42em;
  text-indent:.42em;
  color:#8b90b8;
  margin-bottom:1rem;
}

h1{
  font-family:'Noto Serif JP',serif;
  font-weight:700;
  font-size:clamp(1.6rem,6vw,2.3rem);
  color:var(--ink);
  line-height:1.4;
  margin-bottom:.4rem;
}
.sub{
  font-family:'Noto Serif JP',serif;
  font-size:.9rem;
  color:#7a7f9a;
  margin-bottom:2.2rem;
}

.flyer{
  width:min(240px,70%);
  margin:0 auto 2.2rem;
  box-shadow:0 6px 28px rgba(0,0,50,.15);
  border-radius:4px;
  overflow:hidden;
}
.flyer img{width:100%;display:block}

.notice{
  font-family:'Noto Serif JP',serif;
  font-size:1.15rem;
  color:#111;
  margin-bottom:1rem;
}
.thanks{
  font-size:.95rem;
  color:#444;
  line-height:2;
  margin-bottom:2.2rem;
}

.btn{
  display:inline-block;
  padding:1rem 2.4rem;
  background:var(--ink);
  color:#fff;
  text-decoration:none;
  font-weight:400;
  letter-spacing:.1em;
  border-radius:2em;
  box-shadow:0 4px 16px rgba(26,18,120,.25);
  transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,18,120,.3)}
.btn-note{
  margin-top:.9rem;
  font-size:.78rem;
  color:#8b90b8;
}

footer{
  background:var(--ink);
  color:#aac;
  text-align:center;
  padding:1.8rem 1rem;
  font-size:.75rem;
  letter-spacing:.1em;
}
</style>
</head>
<body>

<div class="stripe-top"></div>

<main>
  <p class="kicker">SOLO EXHIBITION</p>
  <h1>小林広志 個展<br>『七色の軌跡』</h1>
  <p class="sub">2026年10月1日〜7日　コミュニティプラザ 鳥取百花堂</p>

  <div class="flyer">
    <img src="chirashi.jpg" alt="小林広志 個展『七色の軌跡』チラシ">
  </div>

  <p class="notice">本展は終了いたしました。</p>
  <p class="thanks">会期中はたくさんの方にお越しいただき、<br>まことにありがとうございました。<br>会場の様子や作品は、記録サイトでご覧いただけます。</p>

  <a class="btn" href="https://studioyamato.com/nanairo/">記録サイトを見る →</a>
  <p class="btn-note">studioyamato.com/nanairo/</p>
</main>

<footer>
  <div>小林広志 個展『七色の軌跡』</div>
</footer>

</body>
</html>
